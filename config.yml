# EPS — Sveltia CMS configuration
# After creating your GitHub repository, replace REPO below (format: username/repository).
backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/eps-website
  branch: main

media_folder: media/uploads
public_folder: /media/uploads

site_url: https://www.eps-global.com

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Homepage
        file: content/en/home.json
        fields:
          - {name: hero, label: Hero, widget: object, fields: [
              {name: lede, label: Intro paragraph, widget: text}]}
          - {name: machine, label: Hero video block, widget: object, fields: [
              {name: headline, label: Statement over the video, widget: string}]}
          - {name: videos, label: Videos, widget: object, fields: [
              {name: hero, label: Hero loop, widget: object, fields: [
                {name: video, label: Video file (MP4), widget: file, required: false},
                {name: poster, label: Poster image (JPG), widget: image, required: false}]}]}
          - {name: sectors, label: Sector cards, widget: list, fields: [
              {name: title, label: Title, widget: string},
              {name: desc, label: Description, widget: text}]}
      - name: company
        label: Company page
        file: content/en/company.json
        fields:
          - {name: intro, label: Intro paragraph, widget: text}
  - name: sectors
    label: Sector pages
    files:
      - name: automotive
        label: Automotive
        file: content/en/sector-automotive.json
        fields:
          - {name: title, label: Sector name, widget: string}
          - {name: intro, label: Intro paragraph, widget: text}
          - {name: videos, label: Videos, widget: object, fields: [
              {name: opener, label: Full-screen opener loop, widget: object, fields: [
